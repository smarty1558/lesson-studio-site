<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Player Layout</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800;900&family=Noto+Sans+KR:wght@600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #172033;
            --muted: #66748a;
            --purple: #7c3aed;
            --violet: #a78bfa;
            --blue: #60a5fa;
            --mint: #9af7d2;
            --yellow: #fef08a;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 40px;
            font-family: "Noto Sans KR", system-ui, sans-serif;
            color: var(--ink);
            background:
                radial-gradient(circle at 18% 22%, rgba(254, 240, 138, 0.5), transparent 28%),
                radial-gradient(circle at 78% 18%, rgba(96, 165, 250, 0.34), transparent 30%),
                linear-gradient(135deg, #fdfaff, #eef7ff 56%, #fffdf5);
        }

        .stage {
            width: min(880px, 100%);
            display: grid;
            gap: 18px;
        }

        .kicker {
            width: fit-content;
            padding: 7px 13px;
            border: 1px solid rgba(124, 58, 237, 0.18);
            border-radius: 22px;
            background: rgba(255, 255, 255, 0.72);
            color: var(--purple);
            font-size: 0.78rem;
            font-weight: 900;
        }

        h1 {
            margin: 0;
            font-family: "Outfit", "Noto Sans KR", sans-serif;
            font-size: clamp(2.1rem, 5vw, 4rem);
            line-height: 1;
            letter-spacing: 0;
        }

        .mock-frame {
            min-height: 340px;
            display: grid;
            align-content: end;
            padding: clamp(20px, 5vw, 56px);
            border: 1px solid rgba(255, 255, 255, 0.82);
            border-radius: 32px;
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.76)),
                url("./portfolio-default-cover.png") center / cover;
            box-shadow: 0 28px 70px rgba(124, 58, 237, 0.14);
        }

        .osum-audio-chip {
            display: grid;
            grid-template-columns: 1fr;
            gap: 9px;
            padding: 16px 18px 13px;
            border: 1px solid rgba(255, 255, 255, 0.82);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.88);
            box-shadow:
                inset 0 1px 1px rgba(255, 255, 255, 0.92),
                0 20px 38px rgba(23, 32, 51, 0.18);
            backdrop-filter: blur(16px) saturate(150%);
            -webkit-backdrop-filter: blur(16px) saturate(150%);
        }

        .osum-audio-topline {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .osum-audio-title-group {
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .osum-audio-play {
            width: 54px;
            height: 54px;
            display: grid;
            place-items: center;
            flex: 0 0 auto;
            border: 0;
            border-radius: 999px;
            background: linear-gradient(135deg, var(--violet), var(--blue) 64%, var(--yellow));
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: 900;
            box-shadow: 0 14px 28px rgba(96, 165, 250, 0.24);
        }

        .osum-audio-title-group > div {
            min-width: 0;
        }

        strong {
            display: block;
            overflow: hidden;
            font-size: 1rem;
            line-height: 1.1;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .credit {
            display: block;
            margin-top: 3px;
            color: var(--muted);
            font-size: 0.76rem;
            font-weight: 900;
        }

        .osum-audio-volume-inline {
            flex: 0 0 auto;
        }

        .osum-audio-volume-inline label {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .osum-audio-volume-inline span {
            color: var(--purple);
            font-size: 0.68rem;
            font-weight: 1000;
        }

        .osum-audio-volume-inline input {
            --volume-fill: 45%;
            width: clamp(82px, 16vw, 128px);
            height: 18px;
            margin: 0;
            padding: 0;
            border: 0;
            outline: none;
            background: transparent;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
        }

        .osum-audio-volume-inline input:focus,
        .osum-audio-volume-inline input:focus-visible {
            outline: none;
        }

        .osum-audio-volume-inline input::-webkit-slider-runnable-track {
            height: 8px;
            border-radius: 999px;
            background: linear-gradient(90deg, var(--purple) 0 var(--volume-fill), rgba(23, 32, 51, 0.14) var(--volume-fill) 100%);
        }

        .osum-audio-volume-inline input::-webkit-slider-thumb {
            width: 16px;
            height: 16px;
            margin-top: -4px;
            border: 2px solid #ffffff;
            border-radius: 999px;
            background: linear-gradient(135deg, var(--purple), var(--blue));
            box-shadow: 0 6px 14px rgba(124, 58, 237, 0.22);
            appearance: none;
            -webkit-appearance: none;
        }

        .osum-audio-volume-inline input::-moz-range-track {
            height: 8px;
            border: 0;
            border-radius: 999px;
            background: rgba(23, 32, 51, 0.14);
        }

        .osum-audio-volume-inline input::-moz-range-progress {
            height: 8px;
            border-radius: 999px;
            background: var(--purple);
        }

        .osum-audio-volume-inline input::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border: 2px solid #ffffff;
            border-radius: 999px;
            background: linear-gradient(135deg, var(--purple), var(--blue));
            box-shadow: 0 6px 14px rgba(124, 58, 237, 0.22);
        }

        .osum-audio-volume-inline input::-moz-focus-outer {
            border: 0;
        }

        .osum-audio-bottomline {
            display: grid;
            gap: 4px;
        }

        .osum-audio-progress {
            height: 9px;
            overflow: hidden;
            border-radius: 999px;
            background: rgba(23, 32, 51, 0.1);
        }

        .osum-audio-progress span {
            display: block;
            width: 42%;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, var(--purple), var(--blue), var(--mint));
        }

        .osum-audio-time-row {
            display: flex;
            justify-content: space-between;
            color: var(--muted);
            font-family: "Outfit", "Noto Sans KR", sans-serif;
            font-size: 0.76rem;
            font-weight: 900;
            line-height: 1;
        }

        @media (max-width: 620px) {
            body {
                padding: 18px;
            }

            .mock-frame {
                min-height: 300px;
                padding: 16px;
                border-radius: 24px;
            }

            .osum-audio-chip {
                border-radius: 22px;
            }

            .osum-audio-topline {
                align-items: flex-start;
                flex-direction: column;
            }

            .osum-audio-volume-inline,
            .osum-audio-volume-inline label,
            .osum-audio-volume-inline input {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <main class="stage">
        <span class="kicker">Audio Player Concept 04</span>
        <h1>Album Chip Player</h1>
        <section class="mock-frame" aria-label="audio player preview">
            <div class="osum-audio-chip">
                <div class="osum-audio-topline">
                    <div class="osum-audio-title-group">
                        <button type="button" class="osum-audio-play" aria-label="재생">▶</button>
                        <div>
                            <strong>Opening Song Guide</strong>
                            <span class="credit">Anime Opening · Topline</span>
                        </div>
                    </div>
                    <div class="osum-audio-volume-inline">
                        <label>
                            <span>VOL</span>
                            <input type="range" min="0" max="1" step="0.01" value="0.45" aria-label="볼륨">
                        </label>
                    </div>
                </div>
                <div class="osum-audio-bottomline">
                    <div class="osum-audio-progress"><span></span></div>
                    <div class="osum-audio-time-row">
                        <span>01:00</span>
                        <span>02:34</span>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <script>
        document.querySelectorAll('.osum-audio-volume-inline input').forEach((input) => {
            const sync = () => input.style.setProperty('--volume-fill', `${Math.round(Number(input.value) * 100)}%`);
            input.addEventListener('input', sync);
            sync();
        });
    </script>
</body>
</html>
